<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Environment Agency - Weather Dashboard</title>
    <meta name="description" content="Singapore National Environment Agency Weather Dashboard and Assistant" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // Robust error interception to prevent third-party cross-origin scripts from bubbling Script error
      window.onerror = function(message, source, lineno, colno, error) {
        if (!message || message === 'Script error.' || !error) {
          return true; // Suppress reporting to window
        }
        return false;
      };
      window.addEventListener('error', function(event) {
        if (!event.error || event.message === 'Script error.') {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (!event.reason || event.reason.message === 'Script error.' || String(event.reason).indexOf('Script error') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#f8f9fa] text-[#191c1d] font-['Hanken_Grotesk'] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
